# nginx site for crm.cognieos.in
# - serves the built React frontend (static files)
# - reverse-proxies the API and Socket.IO to the Node backend on 127.0.0.1:__API_PORT__
#
# Install:
#   sudo cp deploy/nginx-crm.cognieos.in.conf /etc/nginx/sites-available/crm.cognieos.in
#   sudo ln -sf /etc/nginx/sites-available/crm.cognieos.in /etc/nginx/sites-enabled/crm.cognieos.in
#   sudo nginx -t && sudo systemctl reload nginx
# Then add TLS:
#   sudo certbot --nginx -d crm.cognieos.in
# (certbot rewrites this file to add the :443 server block and redirect.)

server {
    listen 80;
    listen [::]:80;
    server_name crm.cognieos.in;

    # Built frontend (vite build output copied here by deploy.sh)
    root /var/www/cognicrm/frontend/dist;
    index index.html;

    client_max_body_size 10m;

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # health check
    location = /health {
        proxy_pass http://127.0.0.1:__API_PORT__/health;
    }

    # Socket.IO (WebSocket upgrade)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: everything else -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache hashed static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
