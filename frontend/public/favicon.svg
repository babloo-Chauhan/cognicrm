<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- CogniCRM mark: glossy indigo tile, white "C" ring, teal connection node (same geometry as the app icon) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b6cff"/>
      <stop offset="0.5" stop-color="#4f3fe6"/>
      <stop offset="1" stop-color="#2a1f8f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4d0fa"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7df0cc"/>
      <stop offset="0.5" stop-color="#2fd6a6"/>
      <stop offset="1" stop-color="#0b8f6a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14.4" fill="url(#tile)"/>
  <path d="M0 14.4A14.4 14.4 0 0 1 14.4 0h35.2A14.4 14.4 0 0 1 64 14.4V30C44 36 20 36 0 30Z" fill="url(#gloss)"/>
  <path d="M44.01 21.19A16.16 16.16 0 1 0 44.01 42.81" fill="none" stroke="#120a3c" stroke-opacity="0.35" stroke-width="7.4" stroke-linecap="round" transform="translate(0 1.2)"/>
  <path d="M44.01 21.19A16.16 16.16 0 1 0 44.01 42.81" fill="none" stroke="url(#ring)" stroke-width="7.4" stroke-linecap="round"/>
  <circle cx="48.5" cy="32" r="4.4" fill="url(#node)"/>
  <ellipse cx="48.5" cy="30.4" rx="2.6" ry="1.5" fill="#fff" fill-opacity="0.6"/>
</svg>
